model:
  model_name: "qwen 3.5-9B" # Replace with your model
  model_max_length: 2048

data:
  train:
    path: "train_kto.jsonl"
    format: "jsonl"

trainer:
  type: "KTO"
  training_args:
    output_dir: "./output_kto"
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 5.0e-6
    num_train_epochs: 3
    logging_steps: 10
